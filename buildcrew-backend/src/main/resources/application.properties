# --- Datasource (Supabase Postgres) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${SUPABASE_DB_USER}
quarkus.datasource.password=${SUPABASE_DB_PASSWORD}
quarkus.datasource.jdbc.url=${SUPABASE_DB_URL}

# --- JWT (RSA keys generated for signing) ---
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=buildcrew-manager
smallrye.jwt.sign.key.location=privateKey.pem

# --- CORS (allow frontend dev) ---
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
